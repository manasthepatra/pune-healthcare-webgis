apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: webgis-client:slim     # built locally, then: kind load docker-image webgis-client:slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: webgis
spec:
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
