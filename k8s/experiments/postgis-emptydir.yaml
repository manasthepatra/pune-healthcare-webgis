# Q11 second run: same StatefulSet but the PVC is replaced by an emptyDir.
# Not applied by `kubectl apply -f k8s/` (subdirectory). Use:
#   kubectl -n webgis delete statefulset postgis
#   kubectl apply -f k8s/experiments/postgis-emptydir.yaml
# then load data, delete the pod, and see what is lost. Restore with: kubectl apply -f k8s/02-postgis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: webgis
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app: postgis
  template:
    metadata:
      labels:
        app: postgis
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.5
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgis-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}      # pod-lifetime storage: wiped when the pod is deleted
