# Local-dev password only (kind cluster on a laptop). For anything shared, create the Secret from the CLI instead:
#   kubectl -n webgis create secret generic postgis-secret --from-literal=POSTGRES_PASSWORD=... 
apiVersion: v1
kind: Secret
metadata:
  name: postgis-secret
  namespace: webgis
type: Opaque
stringData:
  POSTGRES_USER: webgis
  POSTGRES_DB: webgis
  POSTGRES_PASSWORD: kind-local-only
