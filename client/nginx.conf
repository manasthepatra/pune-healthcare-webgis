server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # PMTiles is read with HTTP Range requests; nginx serves 206 Partial Content for static files by default.
  location /data/ {
    add_header Accept-Ranges bytes;
    add_header Cache-Control "public, max-age=3600";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
